<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rowke 修了証</title>
  <meta property="og:title" content="rowke 修了証">
  <meta property="og:description" content="子どもの航跡の証 — Wake先生より">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
      background:#2a2620; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; padding:22px 14px;
    }
    /* 古紙 */
    .cert-paper {
      width:100%; max-width:460px; position:relative;
      padding:24px 20px;
      filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));
    }
    /* 破れた古紙の本体（縁をギザギザに） */
    .cert-paper::before {
      content:''; position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(40% 30% at 18% 12%, rgba(150,110,50,.16), transparent 60%),
        radial-gradient(46% 34% at 84% 78%, rgba(120,85,40,.18), transparent 62%),
        radial-gradient(30% 22% at 70% 22%, rgba(110,80,35,.12), transparent 60%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.07'/></svg>"),
        radial-gradient(120% 90% at 50% 0%, #f7efd6 0%, #efe3c2 55%, #e2d0a3 100%);
      border:3px solid #9c7b45;
      box-shadow:inset 0 0 50px rgba(120,90,40,.22);
      filter:url(#torn);
    }
    /* 内側の二重罫 */
    .cert-inner {
      position:relative; z-index:1;
      border:1.5px solid #b2925b; outline:1px solid #cdb582; outline-offset:3px;
      padding:30px 24px 26px; text-align:center; color:#3c2f1c;
    }
    .cert-kicker {
      font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:.22em;
      text-transform:uppercase; color:#8a6d3b; margin-bottom:6px;
    }
    .cert-school { font-size:13px; color:#6b5630; letter-spacing:.04em; }
    .cert-school .en { font-family:'Playfair Display',serif; font-weight:700; }
    .cert-title {
      font-family:'Hiragino Mincho ProN','Yu Mincho',serif; font-weight:900;
      font-size:46px; letter-spacing:.42em; color:#2c2010; margin:8px 0 2px;
      padding-left:.42em;
    }
    .cert-sub-en {
      font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px;
      color:#8a6d3b; letter-spacing:.14em; margin-bottom:14px;
    }
    .cert-rule { height:2px; background:linear-gradient(90deg,transparent,#9c7b45,transparent); margin:8px 0 18px; }
    /* 作品（大きく） */
    .cert-art {
      margin:6px auto 18px; padding:8px; background:#fbf6e6;
      border:1px solid #c7ab74; box-shadow:0 8px 22px rgba(60,40,15,.28);
      display:inline-block; max-width:100%;
    }
    .cert-art img { display:block; width:100%; max-width:360px; height:auto; }
    .cert-name {
      font-family:'Hiragino Mincho ProN','Yu Mincho',serif; font-weight:700; font-size:30px;
      letter-spacing:.32em; padding-left:.32em; color:#2c2010; margin:6px 0 2px;
    }
    .cert-name span { font-family:'Hiragino Mincho ProN',serif; font-size:18px; color:#6b5630; margin-left:6px; }
    .cert-proclaim { font-size:13px; line-height:2; color:#4a3b25; margin:10px 4px 18px; }
    .cert-msg-label { font-size:11px; letter-spacing:.1em; color:#8a6d3b; margin:16px 0 4px; }
    .cert-msg { font-size:13px; line-height:2; color:#3c2f1c; text-align:left;
      background:rgba(156,123,69,.07); border:1px solid rgba(156,123,69,.25);
      border-radius:6px; padding:14px 16px; white-space:pre-wrap; }
    /* 手書きサイン */
    .cert-sign { margin:20px 0 4px; text-align:right; }
    .cert-sign .name {
      font-family:'Dancing Script',cursive; font-weight:700; font-size:40px;
      color:#2c2010; line-height:1; transform:rotate(-3deg); display:inline-block;
    }
    .cert-sign .line { height:1px; background:#9c7b45; margin:6px 0 4px; }
    .cert-sign .role { font-size:10.5px; color:#6b5630; letter-spacing:.05em; }
    .cert-meta {
      margin-top:22px; font-size:10.5px; line-height:1.9; color:#7a6537;
      border-top:1px solid rgba(156,123,69,.3); padding-top:12px;
    }
    .cert-seal {
      display:inline-block; margin-top:10px; font-size:10px; letter-spacing:.08em;
      color:#8a6d3b; border:1px solid #b2925b; border-radius:999px; padding:4px 12px;
    }
    .cert-actions { margin-top:22px; }
    .cert-dl {
      font-family:'Hiragino Mincho ProN',serif; font-size:14px; font-weight:700;
      padding:12px 24px; border-radius:8px; border:1px solid #9c7b45; cursor:pointer;
      background:#3c2f1c; color:#f7efd6; letter-spacing:.06em;
    }
    .cert-loading, .cert-error { margin-top:40px; color:#e4d3a8; font-size:14px; }
    /* 印章スタンプ */
    .cert-stamp {
      position:absolute; right:26px; bottom:150px; width:112px; height:112px;
      opacity:.75; transform:rotate(-9deg); z-index:2; pointer-events:none;
      mix-blend-mode:multiply;
    }
    .cert-stamp svg { width:100%; height:100%; }
  </style>
</head>
<body>
  <!-- 破れた縁を作るフィルター -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="torn">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.022" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="cert-root"><div class="cert-loading">証明書を読み込み中…</div></div>
  <canvas id="cert-canvas" width="900" height="1300" style="display:none;"></canvas>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCio3NPmFHG9HEuNkCS4QnSNGlbeM_ZLCs",
      authDomain: "family-compass-37891.firebaseapp.com",
      projectId: "family-compass-37891",
      storageBucket: "family-compass-37891.firebasestorage.app",
      messagingSenderId: "832790097576",
      appId: "1:832790097576:web:7451a91920051c1c769c9d",
      databaseURL: "https://family-compass-37891-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tokenId = new URLSearchParams(location.search).get('id');
    const root = document.getElementById('cert-root');

    function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // ── rowke 印章スタンプ（円形エンブレム）──
    function starPath(cx, cy, outer, inner, points) {
      let d = '';
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 ? inner : outer;
        const a = (Math.PI / points) * i - Math.PI / 2;
        d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1);
      }
      return d + 'Z';
    }
    const STAMP_INK = '#b1432f';
    const STAMP_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <defs>
          <path id="rk-top" d="M42,100 a58,58 0 0 1 116,0"/>
          <path id="rk-bot" d="M46,100 a54,54 0 0 0 108,0"/>
        </defs>
        <g fill="none" stroke="${STAMP_INK}" stroke-width="2.6">
          <circle cx="100" cy="100" r="76"/>
          <circle cx="100" cy="100" r="67"/>
        </g>
        <g fill="${STAMP_INK}" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
          <text font-size="15" letter-spacing="3"><textPath href="#rk-top" startOffset="50%" text-anchor="middle">ROWKE ART STUDIO</textPath></text>
          <text font-size="11" letter-spacing="2"><textPath href="#rk-bot" startOffset="50%" text-anchor="middle">子どもアート教室</textPath></text>
        </g>
        <g stroke="${STAMP_INK}" stroke-width="2.6" stroke-linecap="round">
          <line x1="84" y1="68" x2="84" y2="132"/>
          <path d="M84,73 L131,84 Q119,92 131,100 L84,108 Z" fill="${STAMP_INK}" stroke="none"/>
          <path d="${starPath(103, 90, 9, 3.6, 5)}" fill="#f7efd6" stroke="none"/>
          <path d="M68,122 q8,-8 16,0 t16,0 t16,0 t16,0" fill="none" stroke-width="2.4"/>
        </g>
      </svg>`;

    async function load() {
      if (!tokenId) { root.innerHTML = '<div class="cert-error">証明書IDが指定されていません。</div>'; return; }
      const snap = await db.ref('art/certificates/' + tokenId).once('value');
      const cert = snap.val();
      if (!cert) { root.innerHTML = '<div class="cert-error">証明書が見つかりませんでした。</div>'; return; }

      const imgs = [];
      for (const id of (cert.artworkIds || [])) {
        const aSnap = await db.ref('art/artworks/' + id + '/imageBase64').once('value');
        const b64 = aSnap.val();
        if (b64 && /^data:image\//.test(b64)) imgs.push(b64);
      }
      window._certData = { cert, imgs };

      const issued = new Date(cert.issuedAt);
      const issuedText = `${issued.getFullYear()}年${issued.getMonth() + 1}月${issued.getDate()}日`;

      const teacherBlock = cert.teacherMessage ? `
        <div class="cert-msg-label">先生より</div>
        <div class="cert-msg">${esc(cert.teacherMessage)}</div>
        <div class="cert-sign">
          <div class="name">flotan</div>
          <div class="line"></div>
          <div class="role">flotan 先生 ／ rowke 主宰</div>
        </div>` : '';

      root.innerHTML = `
        <div class="cert-paper">
          <div class="cert-inner">
            <div class="cert-kicker">⚓ Certificate of Completion ⚓</div>
            <div class="cert-school">子どもアート教室 <span class="en">rowke</span>（ローク）</div>
            <div class="cert-title">修了証</div>
            <div class="cert-sub-en">The Voyage of ${esc(cert.studentName)}</div>
            <div class="cert-rule"></div>

            ${imgs.length ? `<div class="cert-art"><img src="${imgs[0]}" alt="代表作品"></div>` : ''}

            <div class="cert-name">${esc(cert.studentName)}<span>殿</span></div>
            <p class="cert-proclaim">あなたは rowke にて、自分だけの“航跡”を漕ぎ進みました。<br>その歩みのすべてを、ここに称えます。</p>

            ${teacherBlock}

            <div class="cert-msg-label"><span style="font-family:'Playfair Display',serif">Wake</span>先生より</div>
            <div class="cert-msg">${esc(cert.wakeMessage)}</div>
            <div class="cert-sign">
              <div class="name">Wake</div>
              <div class="line"></div>
              <div class="role">Wake先生（ウェイク先生）／ rowke AIアート講師</div>
            </div>

            <div class="cert-meta">
              在籍期間：${esc(cert.periodText) || '—'}　・　作品数：${cert.artworkCount || 0}点　・　発行日：${issuedText}<br>
              発行：${esc(cert.issuer)}
              <br><span class="cert-seal">SOULBOUND（譲渡不可）・ ${esc(cert.token_id)}</span>
            </div>

            <div class="cert-actions"><button class="cert-dl" onclick="downloadPng()">画像で保存（PNG）</button></div>
          </div>
          <div class="cert-stamp">${STAMP_SVG}</div>
        </div>`;
    }

    // ===== PNG（ヴィンテージ証書） =====
    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = src;
      });
    }
    // 中央寄せで字間（トラッキング）付きテキスト
    function drawTracked(ctx, text, cx, y, tracking) {
      const chars = [...text];
      const prevAlign = ctx.textAlign;
      ctx.textAlign = 'left';
      let total = 0;
      for (const ch of chars) total += ctx.measureText(ch).width + tracking;
      total -= tracking;
      let x = cx - total / 2;
      for (const ch of chars) {
        ctx.fillText(ch, x, y);
        x += ctx.measureText(ch).width + tracking;
      }
      ctx.textAlign = prevAlign;
    }
    // 破れた縁のギザギザ矩形パス
    function jaggedRectPath(x, y, w, h, seg, jit) {
      const pts = [];
      function edge(x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
        const n = Math.max(2, Math.round(len / seg)), nx = -dy/len, ny = dx/len;
        for (let i = 0; i < n; i++) {
          const t = i / n, j = (Math.random()*2 - 1) * jit;
          pts.push([x1 + dx*t + nx*j, y1 + dy*t + ny*j]);
        }
      }
      edge(x, y, x+w, y); edge(x+w, y, x+w, y+h); edge(x+w, y+h, x, y+h); edge(x, y+h, x, y);
      const p = new Path2D();
      p.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
      p.closePath();
      return p;
    }
    function drawWrapped(ctx, text, x, y, maxW, lineH, measureOnly) {
      const paragraphs = (text || '').split('\n');
      for (const para of paragraphs) {
        let line = '';
        for (const ch of para) {
          if (ctx.measureText(line + ch).width > maxW && line) {
            if (!measureOnly) ctx.fillText(line, x, y); y += lineH; line = ch;
          } else { line += ch; }
        }
        if (line) { if (!measureOnly) ctx.fillText(line, x, y); y += lineH; }
      }
      return y;
    }

    async function downloadPng() {
      const data = window._certData;
      if (!data) return;
      const { cert, imgs } = data;

      // フォントを確実に読み込む（端末でWebフォント未ロードだと文字が崩れるため）
      try {
        await Promise.allSettled([
          document.fonts.load('700 70px "Playfair Display"'),
          document.fonts.load('900 70px "Playfair Display"'),
          document.fonts.load('700 56px "Dancing Script"'),
          document.fonts.load('600 24px "Cormorant Garamond"'),
          document.fonts.load('italic 600 24px "Cormorant Garamond"')
        ]);
        await document.fonts.ready;
        await new Promise(r => setTimeout(r, 150)); // 念のため描画前バッファ
      } catch (e) {}

      const cv = document.getElementById('cert-canvas');
      const W = cv.width;
      const ctx = cv.getContext('2d');
      const PAD = 60, INNER = 30;
      const contentX = PAD + INNER;
      const contentW = W - (PAD + INNER) * 2;

      // 代表作品（大きく・アスペクト比維持）
      let artEl = null, artW = 0, artH = 0;
      if (imgs.length) {
        artEl = await loadImg(imgs[0]);
        const maxW = contentW, maxH = 460;
        const scale = Math.min(maxW / artEl.width, maxH / artEl.height);
        artW = Math.round(artEl.width * scale);
        artH = Math.round(artEl.height * scale);
      }

      // 高さを事前計算
      let y = PAD + 70; // kicker
      y += 30;          // school
      y += 70;          // title
      y += 30;          // sub-en
      y += 30;          // rule
      if (artEl) y += artH + 36;
      y += 50;          // name
      ctx.font = '24px "Hiragino Mincho ProN", serif';
      y = drawWrapped(ctx, 'あなたは rowke にて、自分だけの“航跡”を漕ぎ進みました。その歩みのすべてを、ここに称えます。', contentX, y, contentW, 38, true) + 18;
      const sigBlock = 120; // 署名1つ分の高さ
      if (cert.teacherMessage) {
        y += 28; // label
        y = drawWrapped(ctx, cert.teacherMessage, contentX, y, contentW, 36, true) + sigBlock;
      }
      y += 28; // wake label
      y = drawWrapped(ctx, cert.wakeMessage, contentX, y, contentW, 36, true) + sigBlock;
      y += 90; // meta
      const neededH = y + PAD + 30;
      cv.height = Math.max(1100, Math.ceil(neededH));
      const H = cv.height;

      // ── 古紙背景（破れた縁・外側は透明）──
      ctx.clearRect(0, 0, W, H);
      const paper = jaggedRectPath(12, 12, W - 24, H - 24, 16, 8);
      ctx.save();
      ctx.clip(paper);
      const g = ctx.createRadialGradient(W/2, 60, 100, W/2, H*0.4, H);
      g.addColorStop(0, '#f7efd6'); g.addColorStop(0.55, '#efe3c2'); g.addColorStop(1, '#e0cda0');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // シミ（セピアの染み）
      const stains = [[0.18,0.12,180],[0.84,0.78,220],[0.7,0.3,150],[0.3,0.62,160],[0.9,0.5,120]];
      for (const [sx, sy, sr] of stains) {
        const rg = ctx.createRadialGradient(W*sx, H*sy, 0, W*sx, H*sy, sr);
        rg.addColorStop(0, 'rgba(140,100,45,0.10)'); rg.addColorStop(1, 'rgba(140,100,45,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
      }
      // 紙のざらつき（細かい斑点）
      const speckle = Math.floor(W * H / 900);
      for (let i = 0; i < speckle; i++) {
        const px = Math.random()*W, py = Math.random()*H;
        ctx.fillStyle = `rgba(${Math.random()<0.5?'120,90,45':'255,250,235'},${(Math.random()*0.05).toFixed(3)})`;
        ctx.fillRect(px, py, 1.4, 1.4);
      }
      // 縁の内側を少し焼けたように暗く
      const edge = ctx.createLinearGradient(0, 0, 0, H);
      edge.addColorStop(0, 'rgba(120,85,35,0.18)'); edge.addColorStop(0.06, 'rgba(120,85,35,0)');
      edge.addColorStop(0.94, 'rgba(120,85,35,0)'); edge.addColorStop(1, 'rgba(120,85,35,0.18)');
      ctx.fillStyle = edge; ctx.fillRect(0, 0, W, H);
      ctx.restore();
      // 破れた縁のライン
      ctx.strokeStyle = 'rgba(120,90,45,0.55)'; ctx.lineWidth = 2; ctx.stroke(paper);
      // 外枠
      ctx.strokeStyle = '#9c7b45'; ctx.lineWidth = 4;
      ctx.strokeRect(PAD-16, PAD-16, W-(PAD-16)*2, H-(PAD-16)*2);
      // 内側二重罫
      ctx.strokeStyle = '#b2925b'; ctx.lineWidth = 2;
      ctx.strokeRect(PAD-4, PAD-4, W-(PAD-4)*2, H-(PAD-4)*2);

      ctx.textAlign = 'center';
      // kicker
      ctx.fillStyle = '#8a6d3b'; ctx.font = '22px "Cormorant Garamond", serif';
      let cy = PAD + 34;
      ctx.fillText('⚓  CERTIFICATE OF COMPLETION  ⚓', W/2, cy); cy += 38;
      // school
      ctx.fillStyle = '#6b5630'; ctx.font = '22px "Hiragino Mincho ProN", serif';
      ctx.fillText('子どもアート教室 rowke（ローク）', W/2, cy); cy += 56;
      // title 修了証
      ctx.fillStyle = '#2c2010'; ctx.font = '900 70px "Hiragino Mincho ProN", "Yu Mincho", serif';
      drawTracked(ctx, '修了証', W/2, cy, 30); cy += 22;
      // sub en
      ctx.fillStyle = '#8a6d3b'; ctx.font = 'italic 600 24px "Cormorant Garamond", serif';
      ctx.fillText('The Voyage of ' + cert.studentName, W/2, cy + 14); cy += 44;
      // rule
      ctx.strokeStyle = '#9c7b45'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(contentX, cy); ctx.lineTo(W-contentX, cy); ctx.stroke(); cy += 24;

      // artwork
      if (artEl) {
        const ax = (W - artW)/2;
        ctx.fillStyle = '#fbf6e6'; ctx.fillRect(ax-8, cy-8, artW+16, artH+16);
        ctx.drawImage(artEl, ax, cy, artW, artH);
        ctx.strokeStyle = '#c7ab74'; ctx.lineWidth = 2; ctx.strokeRect(ax-8, cy-8, artW+16, artH+16);
        cy += artH + 36;
      }

      // name
      ctx.fillStyle = '#2c2010'; ctx.font = '700 42px "Hiragino Mincho ProN", "Yu Mincho", serif';
      drawTracked(ctx, cert.studentName + '　殿', W/2, cy, 14); cy += 44;
      // proclaim
      ctx.fillStyle = '#4a3b25'; ctx.font = '24px "Hiragino Mincho ProN", serif';
      cy = drawWrapped2center(ctx, 'あなたは rowke にて、自分だけの“航跡”を漕ぎ進みました。その歩みのすべてを、ここに称えます。', W/2, cy, contentW, 38) + 14;

      // ── 署名ブロック描画ヘルパー ──
      function drawMessage(label, msg, signName, signRole) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#8a6d3b'; ctx.font = '20px "Hiragino Mincho ProN", serif';
        ctx.fillText(label, contentX, cy); cy += 30;
        ctx.fillStyle = '#3c2f1c'; ctx.font = '23px "Hiragino Mincho ProN", serif';
        cy = drawWrapped(ctx, msg, contentX, cy, contentW, 36) + 18;
        // 手書きサイン（右寄せ）
        ctx.textAlign = 'right';
        ctx.fillStyle = '#2c2010'; ctx.font = '700 56px "Dancing Script", cursive';
        ctx.fillText(signName, W - contentX, cy + 30); cy += 46;
        ctx.strokeStyle = '#9c7b45'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(W - contentX - 240, cy); ctx.lineTo(W - contentX, cy); ctx.stroke(); cy += 18;
        ctx.fillStyle = '#6b5630'; ctx.font = '16px "Hiragino Mincho ProN", serif';
        ctx.fillText(signRole, W - contentX, cy); cy += 26;
        ctx.textAlign = 'center';
      }

      if (cert.teacherMessage) {
        drawMessage('先生より', cert.teacherMessage, 'flotan', 'flotan 先生 ／ rowke 主宰');
      }
      drawMessage('Wake先生より', cert.wakeMessage, 'Wake', 'Wake先生（ウェイク先生）／ rowke AIアート講師');

      // meta footer
      cy += 6;
      ctx.strokeStyle = 'rgba(156,123,69,.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(contentX, cy); ctx.lineTo(W-contentX, cy); ctx.stroke(); cy += 26;
      ctx.fillStyle = '#7a6537'; ctx.font = '18px "Hiragino Mincho ProN", serif';
      const issued = new Date(cert.issuedAt);
      ctx.fillText(`在籍期間：${cert.periodText || '—'}　・　作品数：${cert.artworkCount || 0}点　・　発行日：${issued.getFullYear()}年${issued.getMonth()+1}月${issued.getDate()}日`, W/2, cy); cy += 28;
      ctx.fillStyle = '#8a6d3b'; ctx.font = '16px "Hiragino Mincho ProN", serif';
      ctx.fillText(`SOULBOUND（譲渡不可）・ ${cert.token_id}`, W/2, cy);

      // 印章スタンプ（右下に押印）
      try {
        const stampImg = await loadImg('data:image/svg+xml;utf8,' + encodeURIComponent(STAMP_SVG));
        const sz = 165;
        ctx.save();
        ctx.globalAlpha = 0.74;
        ctx.translate(W - 152, H - 300);
        ctx.rotate(-9 * Math.PI / 180);
        ctx.drawImage(stampImg, -sz/2, -sz/2, sz, sz);
        ctx.restore();
      } catch (e) {}

      const a = document.createElement('a');
      a.href = cv.toDataURL('image/png');
      a.download = `rowke-certificate-${cert.token_id}.png`;
      a.click();
    }

    // 中央寄せ折返し（戻り値=次のy）
    function drawWrapped2center(ctx, text, cx, y, maxW, lineH) {
      const words = (text || '').split('');
      let line = '';
      for (const ch of words) {
        if (ctx.measureText(line + ch).width > maxW && line) {
          ctx.fillText(line, cx, y); y += lineH; line = ch;
        } else { line += ch; }
      }
      if (line) { ctx.fillText(line, cx, y); y += lineH; }
      return y;
    }

    load().catch(e => { root.innerHTML = '<div class="cert-error">読み込みエラー：' + esc(e.message) + '</div>'; });
  </script>
</body>
</html>
