<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MILKY-06 — SYSTEM HACK TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#0e110e; --line:#24322a;
    --green:#8df5a5; --dim:#4fd68a; --amber:#f5c542; --red:#ff3c5a;
    --text:#cfe8d5; --text-dim:#6d8a76; --mint:#aef5a8;
    --mono:'JetBrains Mono',monospace; --jp:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:radial-gradient(circle, rgba(141,245,165,0.10) 0.9px, transparent 1px) 0 0/7px 7px, var(--bg);
    color:var(--text);font-family:var(--jp);
    user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body.alert{animation:alertbg 1.6s infinite;}
  @keyframes alertbg{0%,100%{background-color:#0a0a0c}50%{background-color:#160406}}
  body.win{background-color:#04140a;}

  .screen{flex:1;display:none;flex-direction:column;padding:22px 26px;overflow:hidden;}
  .screen.on{display:flex;}

  .bar{
    display:flex;justify-content:space-between;align-items:center;flex:none;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--text-dim);
    border-bottom:1px solid var(--line);padding-bottom:9px;
  }
  .bar .st{color:var(--red);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.25}}
  .corner{position:absolute;top:0;left:0;width:70px;height:70px;z-index:9;}

  /* ---- terminal log ---- */
  .log{
    flex:none;font-family:var(--mono);font-size:12.5px;line-height:1.85;
    color:var(--dim);margin-top:12px;min-height:104px;
  }
  .log .warn{color:var(--red);}
  .cur{display:inline-block;width:8px;background:var(--green);animation:blink .8s steps(1) infinite;}

  /* ---- code display ---- */
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;}
  .prompt{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--text-dim);}
  .slots{display:flex;gap:14px;}
  .slot{
    width:clamp(56px,10vw,84px);height:clamp(72px,13vw,108px);
    border:2px solid var(--line);border-radius:10px;background:#000;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:800;color:var(--green);
    font-size:clamp(34px,6.4vw,56px);
  }
  .slot.filled{border-color:var(--dim);box-shadow:0 0 20px rgba(141,245,165,.2);}
  .slots.bad{animation:shake .4s;}
  .slots.bad .slot{border-color:var(--red);color:var(--red);box-shadow:0 0 20px rgba(255,60,90,.3);}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .msg{font-family:var(--mono);font-size:14px;letter-spacing:.14em;min-height:22px;color:var(--red);}

  /* ---- keypad ---- */
  .pad{
    flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:11px;
    max-width:440px;width:100%;margin:14px auto 0;
  }
  .pad button{
    background:var(--mint);color:#000;border:none;border-radius:14px;
    font-family:var(--mono);font-weight:800;font-size:clamp(24px,4.4vw,32px);
    padding:clamp(14px,2.4vw,20px) 0;box-shadow:5px 5px 0 #000;cursor:pointer;
  }
  .pad button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000;}
  .pad button.alt{background:#2a3a2e;color:var(--text);box-shadow:none;border:1px solid var(--line);font-size:15px;letter-spacing:.1em;}
  .pad button.go{background:var(--green);font-size:16px;letter-spacing:.14em;}

  .tries{margin-top:12px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.12em;flex:none;}

  /* ---- unlocked ---- */
  #done{justify-content:center;align-items:center;text-align:center;}
  .okmark{
    font-size:clamp(52px,11vw,92px);color:var(--green);font-family:var(--mono);font-weight:800;
    letter-spacing:.06em;text-shadow:0 0 40px rgba(141,245,165,.5);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.5);
  }
  @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
  .okline{font-family:var(--mono);font-size:clamp(13px,2.2vw,17px);letter-spacing:.2em;color:var(--dim);margin-top:14px;}
  .okjp{font-size:clamp(18px,3.2vw,26px);font-weight:900;color:#e6ffe9;margin-top:26px;line-height:1.6;}
  .oknote{margin-top:18px;font-size:15px;color:var(--text-dim);max-width:520px;}
  .again{
    margin-top:34px;background:none;border:1px solid var(--line);color:var(--text-dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:11px 22px;
    border-radius:999px;cursor:pointer;
  }
  .bars{display:flex;gap:5px;margin-top:26px;}
  .bars i{width:26px;height:7px;background:var(--line);border-radius:2px;}
  .bars i.on{background:var(--green);box-shadow:0 0 12px rgba(141,245,165,.6);}
</style>
</head>
<body>

<div class="corner" id="corner"></div>

<!-- ============ TERMINAL ============ -->
<div class="screen on" id="term">
  <div class="bar">
    <span>MILKY-06 / CONTROL TERMINAL</span>
    <span class="st">● TRAIN CONTROL LOST</span>
  </div>

  <div class="log">
    &gt; SYSTEM BOOT ........ OK<br>
    &gt; BRAKE UNIT ......... <span class="warn">LOCKED</span><br>
    &gt; <span class="warn">4桁のアクセスコードを入力してください</span><span class="cur">&nbsp;</span>
  </div>

  <div class="mid">
    <div class="prompt">ACCESS CODE</div>
    <div class="slots" id="slots">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="pad" id="pad"></div>
  <div class="tries" id="tries">試行回数 0</div>
</div>

<!-- ============ UNLOCKED ============ -->
<div class="screen" id="done">
  <div class="okmark">UNLOCKED</div>
  <div class="okline">BRAKE SYSTEM ONLINE</div>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="okjp">非常ブレーキの権限を取得した。<br>ただし銀河特急はまだ走行中。</div>
  <div class="oknote">プラレールの銀河特急を止めれば任務完了。全員、線路の前へ集合してください。</div>
  <button class="again" onclick="reset()">端末をロックし直す</button>
</div>

<script>
let CODE = "2026";
let input = "", tries = 0, locked = false;

try{ CODE = localStorage.getItem("milky_code") || "2026"; }catch(e){}

/* ---- keypad ---- */
const KEYS = ["1","2","3","4","5","6","7","8","9","CLEAR","0","ENTER"];
const pad = document.getElementById("pad");
KEYS.forEach(k => {
  const b = document.createElement("button");
  b.textContent = k;
  if(k === "CLEAR") b.className = "alt";
  if(k === "ENTER") b.className = "go";
  b.onclick = () => press(k);
  pad.appendChild(b);
});

function press(k){
  if(locked) return;
  if(k === "CLEAR"){ input = ""; draw(); beep(500); return; }
  if(k === "ENTER"){ submit(); return; }
  if(input.length >= 4) return;
  input += k; draw(); beep(1000 + input.length*140);
  if(input.length === 4) setTimeout(submit, 320);
}

function draw(){
  document.querySelectorAll("#slots .slot").forEach((s,i) => {
    s.textContent = input[i] || "";
    s.classList.toggle("filled", !!input[i]);
  });
}

function submit(){
  if(input.length < 4){ flash("CODE INCOMPLETE"); return; }
  tries++;
  document.getElementById("tries").textContent = "試行回数 " + tries;
  if(input === CODE){ win(); }
  else{ flash("ACCESS DENIED"); }
}

function flash(t){
  locked = true;
  document.body.classList.add("alert");
  document.getElementById("msg").textContent = t;
  document.getElementById("slots").classList.add("bad");
  buzz();
  setTimeout(() => {
    document.getElementById("slots").classList.remove("bad");
    document.body.classList.remove("alert");
    document.getElementById("msg").textContent = "";
    input = ""; draw(); locked = false;
  }, 1500);
}

function win(){
  locked = true;
  document.body.classList.add("win");
  document.getElementById("term").classList.remove("on");
  document.getElementById("done").classList.add("on");
  chime();
  const bars = document.querySelectorAll("#bars i");
  bars.forEach((b,i) => setTimeout(() => b.classList.add("on"), 260 + i*170));
}

function reset(){
  input = ""; locked = false; draw();
  document.body.classList.remove("win");
  document.querySelectorAll("#bars i").forEach(b => b.classList.remove("on"));
  document.getElementById("done").classList.remove("on");
  document.getElementById("term").classList.add("on");
}

/* ---- コード変更（左上を3回タップ） ---- */
let taps = 0, tapT = null;
document.getElementById("corner").onclick = () => {
  taps++; clearTimeout(tapT);
  tapT = setTimeout(() => taps = 0, 900);
  if(taps >= 3){
    taps = 0;
    const v = prompt("アクセスコードを設定（4桁の数字）", CODE);
    if(v && /^\d{4}$/.test(v)){
      CODE = v;
      try{ localStorage.setItem("milky_code", v); }catch(e){}
      alert("コードを " + v + " に設定しました");
    }
  }
};

/* ---- sound ---- */
function tone(f, type, dur, vol){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = f; o.type = type; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }catch(e){}
}
function beep(f){ tone(f, "square", 0.09, 0.11); }
function buzz(){ tone(110, "sawtooth", 0.5, 0.2); setTimeout(() => tone(90, "sawtooth", 0.6, 0.2), 180); }
function chime(){
  [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f, "sine", 0.6, 0.22), i*150));
}

draw();
</script>
</body>
</html>
