<style>

    --slate:#273739; --eblue:#1350F0; --azure:#4592F8; --lime:#C8F22C; --yellow:#FFFF21; --mist:#D3EAEF;

  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Hiragino Sans','Yu Gothic',sans-serif;color:var(--mist);}

  .btn.ghost{background:transparent;border:1px solid rgba(211,234,239,.3);color:var(--mist);}
  .btn.block{width:100%;}
  .round{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;background:var(--slate);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:50%;font-weight:700;font-family:inherit;cursor:pointer;}
  /* 配置 */
  #openSubmit{position:fixed;left:16px;top:16px;z-index:12;}
  #openAd{position:fixed;left:16px;top:62px;z-index:12;font-size:13px;padding:9px 14px;}
  #lite{position:fixed;right:16px;top:16px;z-index:12;font-size:12px;padding:8px 13px;}
  #fwd{position:fixed;right:20px;bottom:40px;width:78px;height:78px;font-size:13px;z-index:9;display:none;}
  #mvL{position:fixed;left:20px;bottom:40px;width:64px;height:64px;z-index:9;display:none;}
  #mvR{position:fixed;left:96px;bottom:40px;width:64px;height:64px;z-index:9;display:none;}
  #berry{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;}
  #peek{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;display:none;}
  #adPeek{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:9;display:none;}
  /* スマホ：中央のボタンを移動ボタンの上に逃がして重ならないようにする */
  @media (max-width:820px){
    #berry{bottom:136px;}
    #peek{bottom:192px;}
    #adPeek{bottom:248px;}
  }
  .field{width:100%;padding:9px;margin-bottom:8px;border-radius:8px;border:1px solid rgba(211,234,239,.25);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;}
  .panel{background:var(--panel);border:1px solid rgba(211,234,239,.22);border-radius:18px;padding:18px;}
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';
// 線だけのシンプルなアイコン（絵文字は使わない）
const IC={
  link:`<svg class="ic" style="width:15px;height:15px;vertical-align:-2px" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.66 0l3-3a4 4 0 00-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 00-5.66 0l-3 3a4 4 0 005.66 5.66l1-1"/></svg>`,
  edit:`<svg class="ic" style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>`,
  trash:`<svg class="ic" style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>`,
};
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || ('ontouchstart' in window && innerWidth<900);
let fbReady=false, db=null, storage=null;
try{
  firebase.initializeApp({
    apiKey:"AIzaSyBaHdrESJGmNEPCBOh_XlOjgy_4lhFg5LE", authDomain:"rowke-app.firebaseapp.com",
    databaseURL:"https://rowke-app-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"rowke-app",
    storageBucket:"rowke-app.firebasestorage.app", messagingSenderId:"950459153761", appId:"1:950459153761:web:ea18c5d7cb55ed589a9920"
  });
  db=firebase.database(); storage=firebase.storage(); fbReady=true;
}catch(e){ console.error('firebase init failed', e); }

let scene,camera,renderer;
const RADIUS_BASE=14, FRAME_ARC=4.2; // 額1枚あたりの円周上の間隔(m)
function initScene(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a1826);
  scene.fog=new THREE.Fog(0x0a1826, 26, 90);
  camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
  camera.position.set(0,1.6,RADIUS_BASE-4);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  // 照明（寒色）
  scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x1a3350, 0.9));
  const dir=new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(8,20,6); scene.add(dir);
  // 凍った床（薄く反射する寒色）
  const floor=new THREE.Mesh(new THREE.CircleGeometry(120,64),
    new THREE.MeshStandardMaterial({color:0x16324a,roughness:0.35,metalness:0.1}));
  floor.rotation.x=-Math.PI/2; floor.position.y=0; scene.add(floor);
  // 中央の流氷風・低ポリ氷山（目印）
  buildIceberg();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  // 動作確認用モック / 実データ購読
  if(new URLSearchParams(location.search).get('mock')){
    const url='https://art-feedback.vercel.app/wake-sensei.png';
    layoutExhibits(Array.from({length:8},(_,i)=>({id:'m'+i,productName:'Product'+i,author:'Name'+i,link:'',highlight:'',imageUrl:url})));
    frames.forEach(loadFrameImage);
  } else {
    subscribeExhibits();
  }
  subscribeAds();
  animate();
}

let frames=[];
function radiusFor(n){ return Math.max(RADIUS_BASE, (Math.max(n,1)*FRAME_ARC)/(2*Math.PI)); }
function clearFrames(){ frames.forEach(f=>{ scene.remove(f.mesh); if(f.picMesh) scene.remove(f.picMesh); }); frames=[]; }
function layoutExhibits(list){
  clearFrames();
  const n=list.length, R=radiusFor(n);
  const FW=2.2, FH=FW*1.414; // A4縦の額サイズ(m)
  list.forEach((d,i)=>{
    const ang=(i/Math.max(n,1))*Math.PI*2;
    const x=Math.sin(ang)*R, z=Math.cos(ang)*R;
    const frame=new THREE.Mesh(new THREE.BoxGeometry(FW+0.22,FH+0.22,0.14),
      new THREE.MeshStandardMaterial({color:0xdff2ff,roughness:0.4}));
    frame.position.set(x,FH/2+0.6,z);
    frame.lookAt(0,FH/2+0.6,0); // 中央（内向き）
    scene.add(frame);
    frames.push({mesh:frame,data:d,pos:frame.position.clone(),picMesh:null,ang});
  });
}

const texLoader=new THREE.TextureLoader();
function applyFrameTexture(f,url){
  if(!url || f.picMesh) return;
  texLoader.load(url,(tex)=>{
    tex.colorSpace=THREE.SRGBColorSpace;
    const FW=2.2, FH=FW*1.414;
    const pic=new THREE.Mesh(new THREE.PlaneGeometry(FW,FH), new THREE.MeshBasicMaterial({map:tex}));
    pic.position.copy(f.mesh.position); pic.quaternion.copy(f.mesh.quaternion);
    pic.translateZ(0.09); // 額の前面へ
    scene.add(pic); f.picMesh=pic;
  });
}
function loadFrameImage(f){
  if(f.picMesh) return;
  if(f.data.imageUrl){ applyFrameTexture(f,f.data.imageUrl); return; } // モック等の直接URL
  if(fbReady && f.data.id){ db.ref('penguin/images/'+f.data.id).once('value').then(s=>applyFrameTexture(f,s.val())); } // 画像はDBから遅延読み込み
}
function subscribeExhibits(){
  if(!fbReady) return;
  db.ref('penguin/exhibits').on('value',snap=>{
    const val=snap.val()||{};
    const list=Object.entries(val).map(([id,d])=>({id,...d})).sort((a,b)=>(a.ts||0)-(b.ts||0));
    layoutExhibits(list);
    frames.forEach(loadFrameImage);
  });
}
let yaw=0,pitch=0,move=false,moveL=false,moveR=false; const keys={};
if(isMobile){ document.body.classList.add('mobile'); document.getElementById('touch').style.display='block';
  ['fwd','mvL','mvR'].forEach(id=>document.getElementById(id).style.display='flex'); }
function setupControls(){
  if(!isMobile){
    addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
    addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
    const cv=document.getElementById('c'); let down=false,lx=0,ly=0; cv.style.cursor='grab';
    cv.addEventListener('mousedown',e=>{down=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';});
    addEventListener('mouseup',()=>{down=false;cv.style.cursor='grab';});
    addEventListener('mousemove',e=>{ if(!down)return; yaw-=(e.clientX-lx)*0.004; pitch-=(e.clientY-ly)*0.004; pitch=Math.max(-1.2,Math.min(1.2,pitch)); lx=e.clientX; ly=e.clientY; });
  } else {
    const t=document.getElementById('touch'); let lx=0,ly=0,drag=false;
    t.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
    t.addEventListener('touchmove',e=>{ if(!drag)return; const x=e.touches[0].clientX,y=e.touches[0].clientY; yaw-=(x-lx)*0.005; pitch-=(y-ly)*0.005; pitch=Math.max(-1.2,Math.min(1.2,pitch)); lx=x;ly=y; },{passive:true});
    t.addEventListener('touchend',()=>drag=false);
    const bind=(id,setOn,setOff)=>{ const b=document.getElementById(id);
      b.addEventListener('touchstart',e=>{e.preventDefault();setOn();}); b.addEventListener('touchend',setOff); b.addEventListener('touchcancel',setOff); };
    bind('fwd',()=>move=true,()=>move=false);
    bind('mvL',()=>moveL=true,()=>moveL=false);
    bind('mvR',()=>moveR=true,()=>moveR=false);
  }
}
let submissionsOpen=true;
if(fbReady) db.ref('penguin/config/submissionsOpen').on('value',s=>{ submissionsOpen = s.val()!==false; });
const ADMIN_CODE='penguin2026'; // 誤操作防止レベル（本物の認証ではない）
if(new URLSearchParams(location.search).get('admin')) document.getElementById('admin').style.display='flex';
function adminUnlock(){
  if(document.getElementById('a-code').value!==ADMIN_CODE){ alert('合言葉が違います'); return; }
  document.getElementById('admin-gate').style.display='none';
  document.getElementById('admin-body').style.display='block';
  db.ref('penguin/config/submissionsOpen').once('value').then(s=>{ document.getElementById('a-open').checked = s.val()!==false; });
  renderAdminList();
}
function toggleSubmissions(v){ db.ref('penguin/config/submissionsOpen').set(!!v); }
function renderAdminList(){
  db.ref('penguin/exhibits').once('value').then(snap=>{
    const val=snap.val()||{}; const el=document.getElementById('a-list');
    el.innerHTML=Object.entries(val).map(([id,d])=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.1);padding:8px 0;"><span style="font-size:13px;color:#fff;">${esc(d.productName||'無題')} <span style="color:var(--azure);">/ ${esc(d.author||'')}</span></span><button onclick="deleteExhibit('${id}')" class="btn" style="background:#5a2130;padding:4px 12px;font-size:13px;">${IC.trash}削除</button></div>`).join('')||'<div style="color:var(--mist);opacity:.7;padding:8px 0;">まだ展示がありません</div>';
  });
}
async function deleteExhibit(id){
  if(!confirm('この展示を削除しますか？')) return;
  try{ await db.ref('penguin/exhibits/'+id).remove(); await db.ref('penguin/images/'+id).remove().catch(()=>{}); renderAdminList(); }
  catch(e){ alert('削除に失敗：'+(e.message||e)); }
}
// 自分が出したポスターの記録（この端末）
const MINE_KEY='pg_mine';
function myKeys(){ try{return JSON.parse(localStorage.getItem(MINE_KEY)||'[]');}catch(e){return[];} }
function addMine(k){ const a=myKeys(); if(!a.includes(k)){ a.push(k); localStorage.setItem(MINE_KEY,JSON.stringify(a)); } }
function rmMine(k){ localStorage.setItem(MINE_KEY,JSON.stringify(myKeys().filter(x=>x!==k))); }
let editingKey=null;
function editExhibit(id){
  const f=frames.find(fr=>fr.data.id===id); if(!f) return; const d=f.data;
  editingKey=id;
  document.getElementById('f-product').value=d.productName||'';
  document.getElementById('f-author').value=d.author||'';
  document.getElementById('f-link').value=d.link||'';
  document.getElementById('f-highlight').value=d.highlight||'';
  document.getElementById('submit-title').textContent='ポスターを修正する';
  document.getElementById('sub-note').textContent='内容を修正できます。画像を変える時だけファイルを選び直してください';
  const go=document.getElementById('f-go'); go.textContent='更新する'; go.disabled=false; go.style.opacity=1;
  closeInfo();
  document.getElementById('submit').style.display='flex';
}
async function deleteMine(id){
  if(!confirm('あなたのポスターを削除しますか？')) return;
  try{ await db.ref('penguin/exhibits/'+id).remove(); await db.ref('penguin/images/'+id).remove().catch(()=>{}); rmMine(id); closeInfo(); }
  catch(e){ alert('削除に失敗：'+(e.message||e)); }
}
function showSubmit(){
  editingKey=null;
  document.getElementById('submit-title').textContent='ポスターを展示する';
  const n=document.getElementById('sub-note'), go=document.getElementById('f-go');

  document.getElementById('f-file').value='';

function resizeCanvas(cv,max=2000){
  const w=cv.width,h=cv.height,s=Math.min(1,max/Math.max(w,h)); if(s>=1) return cv;
  const o=document.createElement('canvas'); o.width=Math.round(w*s); o.height=Math.round(h*s);
  o.getContext('2d').drawImage(cv,0,0,o.width,o.height); return o;
}
async function fileToCanvas(file){
  if(file.type==='application/pdf'){
    const buf=await file.arrayBuffer();
    const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:2});
    const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    return cv;
  } else {
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
    const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    cv.getContext('2d').drawImage(img,0,0); return cv;
  }
}

function clearSpot(rMin,rMax){

    if(!obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+0.9)) return {x,z}; }
  const a=Math.random()*6.283; return {x:Math.sin(a)*rMax, z:Math.cos(a)*rMax};
}
function buildIceberg(){
  obstacles=[{x:0,z:0,r:5}]; // 中央氷山
  const grp=new THREE.Group();
  const iceMat=new THREE.MeshStandardMaterial({color:0xe4f2ff,roughness:0.65,flatShading:true});
  const iceMat2=new THREE.MeshStandardMaterial({color:0xbcd8f5,roughness:0.65,flatShading:true});
  // 尖った低ポリの峰（主峰＋副峰）
  const peaks=[[0,0,4.2,9,7],[2.6,1.5,2.4,5.5,5],[-2.8,1.2,2.0,4.8,5],[1.2,-2.6,2.2,6.2,6],[-1.6,-2.2,1.6,4.0,5]];
  peaks.forEach(([x,z,r,h,seg],i)=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg), i%2?iceMat2:iceMat);
    c.position.set(x,h/2,z); c.rotation.y=Math.random()*Math.PI; grp.add(c); });
  // 足元の流氷：不均一に（一部スキップ・箱/尖った氷/結晶を混在）
  const slots=8;
  for(let i=0;i<slots;i++){
    if(Math.random()<0.32) continue; // 一部は氷を置かない
    const a=(i/slots)*6.283 + (Math.random()-0.5)*0.5, r=4.3+Math.random()*2.4;
    const x=Math.sin(a)*r, z=Math.cos(a)*r; const kind=Math.random(); let m, foot;
    if(kind<0.5){ const w=2+Math.random()*2.2, h=0.4+Math.random()*0.7, dp=1.8+Math.random()*1.8;
      m=new THREE.Mesh(new THREE.BoxGeometry(w,h,dp), i%2?iceMat:iceMat2); m.position.set(x,h/2,z); m.rotation.y=Math.random()*Math.PI; foot=Math.max(w,dp)/2; }
    else if(kind<0.8){ const s=1.2+Math.random()*1.4; m=new THREE.Mesh(new THREE.ConeGeometry(s,s*1.7,5), iceMat); m.position.set(x,s*0.85,z); m.rotation.y=Math.random()*Math.PI; foot=s; }
    else { const s=1+Math.random()*1.2; m=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), iceMat2); m.position.set(x,s*0.6,z); m.rotation.set(Math.random(),Math.random(),Math.random()); foot=s; }
    grp.add(m); obstacles.push({x,z,r:foot});
  }
  scene.add(grp); return grp;
}

// GLBモデル（ペンギン・いちご）を読み込んで使う
const gltfLoader=new GLTFLoader(); let penguinProto=null, berryProto=null; let _lastPenguinCount=1;
let penguinAgents=[]; let _plt=performance.now();
function updatePenguins(){
  if(!penguinAgents.length) return;
  const now=performance.now(), dt=Math.min(0.05,(now-_plt)/1000); _plt=now;
  const Rmin=8, Rmax=Math.max(11, radiusFor(frames.length)-2);
  for(const a of penguinAgents){
    a.phase+=dt*a.wad;
    if(a.mode!=='walk'){ // 鑑賞・会話：その場で止まって向きだけ固定＋小さく揺れる
      a.obj.lookAt(a.face.x, a.obj.position.y, a.face.z);
      a.obj.rotateZ(Math.sin(a.phase)*0.05);
      a.obj.position.y=a.baseY+Math.abs(Math.sin(a.phase))*0.02;
      continue;
    }
    a.turnT-=dt; if(a.turnT<=0){ a.heading+=(Math.random()-0.5)*1.3; a.turnT=2+Math.random()*3; }
    a.obj.position.x+=Math.sin(a.heading)*a.speed*dt; a.obj.position.z+=Math.cos(a.heading)*a.speed*dt;
    // 氷（obstacles）を避ける：近すぎたら氷から離れる向きへ
    for(const o of obstacles){ const ox=a.obj.position.x-o.x, oz=a.obj.position.z-o.z, od=Math.hypot(ox,oz);
      if(od<o.r+1.3){ a.heading=Math.atan2(ox,oz);
        a.obj.position.x+=Math.sin(a.heading)*a.speed*dt*2; a.obj.position.z+=Math.cos(a.heading)*a.speed*dt*2; break; } }
    const d=Math.hypot(a.obj.position.x,a.obj.position.z);
    if(d>Rmax){ a.heading=Math.atan2(-a.obj.position.x,-a.obj.position.z); } // 外に出たら中心へ
    else if(d<Rmin){ a.heading=Math.atan2(a.obj.position.x,a.obj.position.z); } // 内に入りすぎたら外へ
    a.obj.lookAt(a.obj.position.x+Math.sin(a.heading), a.obj.position.y, a.obj.position.z+Math.cos(a.heading));
    a.obj.rotateZ(Math.sin(a.phase)*0.16);          // よちよち（左右に揺れる）
    a.obj.position.y=a.baseY+Math.abs(Math.sin(a.phase))*0.05; // 上下の弾み
  }
}
function fitProto(obj,targetH){ obj.updateMatrixWorld(true); const box=new THREE.Box3().setFromObject(obj);
  const s=targetH/(box.getSize(new THREE.Vector3()).y||1); obj.scale.setScalar(s); obj.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(obj); obj.userData.footY=-b2.min.y; return obj; }

function buildPenguins(count){
  _lastPenguinCount=count;
  if(!penguinProto) return; // 読み込み完了後に呼ばれる
  penguins=new THREE.Group(); penguinAgents=[];
  const footY=penguinProto.userData.footY||0;
  const R=Math.max(10, radiusFor(frames.length)-2);
  const addPeng=(x,z)=>{ const p=skeletonClone(penguinProto); p.position.set(x,footY,z); penguins.add(p); return p; };
  let made=0;
  // 3匹で会話しているグループ（向き合って輪になる）
  const groups=Math.max(1, Math.floor(count/12));
  for(let g=0; g<groups && made+3<=count; g++){
    const c=clearSpot(9,R-1); const gc=new THREE.Vector3(c.x,footY,c.z); // グループ中心を向く
    for(let k=0;k<3;k++){ const ang=k/3*6.283; const p=addPeng(c.x+Math.cos(ang)*0.95, c.z+Math.sin(ang)*0.95);
      penguinAgents.push({obj:p,baseY:footY,phase:Math.random()*6.28,wad:2.5+Math.random()*1.5,mode:'chat',face:gc.clone()}); made++; }
  }
  // 約1/5は止まってポスター/広告を鑑賞
  const watchers=Math.max(1, Math.round(count*0.2));
  for(let i=0;i<watchers && made<count;i++,made++){ const c=clearSpot(9.5,R); const p=addPeng(c.x,c.z);
    const face = (i%2===0) ? new THREE.Vector3(c.x*2,footY,c.z*2)   // 外向き＝ポスターを見る
                           : new THREE.Vector3(0,footY,0);          // 内向き＝広告/中央を見る
    penguinAgents.push({obj:p,baseY:footY,phase:Math.random()*6.28,wad:2+Math.random()*1.5,mode:'watch',face}); }
  // 残りは歩き回る（氷を避ける）
  for(; made<count; made++){ const c=clearSpot(8.5,R); const p=addPeng(c.x,c.z);
    penguinAgents.push({obj:p,baseY:footY,phase:Math.random()*6.28,wad:5+Math.random()*3,mode:'walk',
      heading:Math.random()*6.283,speed:0.5+Math.random()*0.6,turnT:1+Math.random()*3}); }
  // ファーストペンギン：地面の縁から飛び出そうとしている1体（前のめり・歩かない）
  const first=addPeng(0.6,8.4); first.lookAt(0,footY,0); first.rotateX(-0.55);
  scene.add(penguins);
}

  ];
  P.forEach(p=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.w/AR), mat);
    m.position.set(Math.sin(p.ang)*p.r, p.y, Math.cos(p.ang)*p.r);
    m.lookAt(0, p.y-2, 0); m.rotateX(p.tilt); skySigns.add(m); });
  scene.add(skySigns);
}
function buildDecor(){ buildAurora(); buildSnow(); buildPenguins(28); buildSkySigns(); }
function toggleLite(){ LITE=!LITE;
  if(aurora){scene.remove(aurora);scene.remove(aurora.userData.a2);aurora=null;}
  if(snow){scene.remove(snow);snow=null;} if(penguins){scene.remove(penguins);penguins=null;}
  if(!LITE) buildDecor(); else { buildSnow(); buildPenguins(12); }
  document.getElementById('lite').textContent=LITE?'標準モード':'軽量モード';
}

const berries=[]; const berryGeo=new THREE.SphereGeometry(0.16,10,8); const berryMat=new THREE.MeshStandardMaterial({color:0xff375f,roughness:0.5});
function throwBerry(){
  const m = berryProto ? berryProto.clone() : new THREE.Mesh(berryGeo,berryMat);
  m.position.copy(camera.position);
  const dir=_fwd.clone().normalize();
  const v=dir.multiplyScalar(9); v.y=4.5;
  const spin=new THREE.Vector3((Math.random()-.5)*6,(Math.random()-.5)*6,(Math.random()-.5)*6);
  berries.push({m,v,life:6,spin}); scene.add(m);
  if(berries.length>120){ const old=berries.shift(); scene.remove(old.m); }
}
let _lt=performance.now();
function updateBerries(){
  const now=performance.now(), dt=Math.min(0.05,(now-_lt)/1000); _lt=now;
  for(let i=berries.length-1;i>=0;i--){ const b=berries[i];
    b.v.y-=14*dt; b.m.position.addScaledVector(b.v,dt);
    if(b.spin){ b.m.rotation.x+=b.spin.x*dt; b.m.rotation.y+=b.spin.y*dt; b.m.rotation.z+=b.spin.z*dt; }
    if(b.m.position.y<0.16){ b.m.position.y=0.16; b.v.y=-b.v.y*0.4; b.v.x*=0.7; b.v.z*=0.7; if(b.spin)b.spin.multiplyScalar(0.6); }
    b.life-=dt; if(b.life<=0){ scene.remove(b.m); berries.splice(i,1); }
  }
}

const _fwd=new THREE.Vector3(), _right=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  updateDecor(performance.now()*0.001);
  updateBerries();
  updatePenguins();
  camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;
  _fwd.set(-Math.sin(yaw),0,-Math.cos(yaw)); _right.set(Math.cos(yaw),0,-Math.sin(yaw));
  const sp=0.14;
  if(keys['w']||keys['arrowup']||move) camera.position.addScaledVector(_fwd,sp);
  if(keys['s']||keys['arrowdown']) camera.position.addScaledVector(_fwd,-sp);
  if(keys['a']||keys['arrowleft']||moveL) camera.position.addScaledVector(_right,-sp);
  if(keys['d']||keys['arrowright']||moveR) camera.position.addScaledVector(_right,sp);
  const lim=radiusFor(frames.length)+3; const dd=Math.hypot(camera.position.x,camera.position.z);
  if(dd>lim){ camera.position.x*=lim/dd; camera.position.z*=lim/dd; }
  camera.position.y=1.6;
  // 近接判定
  let nf=null,nd=5.5;
  frames.forEach(f=>{ const d2=camera.position.distanceTo(f.pos); if(d2<nd){nd=d2;nf=f;} });
  if((nf&&nf.data.id)!==(nearFrame&&nearFrame.data.id)){
    nearFrame=nf; closeInfo(); document.getElementById('peek').style.display= nf?'inline-block':'none';
  }
  // 広告の近接判定
  let na=null,nad=6;
  adFrames.forEach(a=>{ const d3=camera.position.distanceTo(a.pos); if(d3<nad){nad=d3;na=a;} });
  if((na&&na.data.id)!==(nearAd&&nearAd.data.id)){
    nearAd=na; if(document.getElementById('adview').style.display!=='flex') document.getElementById('adPeek').style.display= na?'inline-block':'none';
  }
  renderer.render(scene,camera);
}
initScene();
setupControls();
buildDecor();

// インラインonclickから呼べるようにグローバル公開（module化のため）
Object.assign(window,{ throwBerry, openInfo, closeInfo, openAdView, closeAdView, showAd, doAd, showSubmit, doSubmit, toggleLite, adminUnlock, toggleSubmissions, editExhibit, deleteMine, deleteExhibit, deleteAd });
</script>
